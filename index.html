<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Pacifico&family=Oswald:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/konva@9.3.20/konva.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      background: #0c0c0e;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, sans-serif;
    }
    aside {
      width: 280px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid #232328;
      background: #141416;
      overflow-y: auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 650;
    }
    button, label.btn {
      background: #222226;
      color: #f4f4f5;
      border: 1px solid #34343a;
      border-radius: 10px;
      padding: 11px 12px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
    }
    button:hover, label.btn:hover { background: #2a2a30; }
    button.primary {
      background: #e11d48;
      border-color: #e11d48;
      font-weight: 650;
      text-align: center;
    }
    button.primary:hover { background: #be123c; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input[type="file"] { display: none; }
    .colors {
      display: flex;
      gap: 8px;
      padding: 2px 0 6px;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #3a3a40;
      padding: 0;
    }
    .swatch.active { outline: 2px solid #fff; outline-offset: 2px; }
    .caption {
      margin: 2px 0 -4px;
      color: #8b8b93;
      font-size: 12px;
    }
    .layouts {
      display: flex;
      gap: 8px;
    }
    .layouts label { flex: 1; cursor: pointer; }
    .layouts input { display: none; }
    .layouts span {
      display: block;
      padding: 9px 0;
      text-align: center;
      font-size: 14px;
      background: #222226;
      border: 1px solid #34343a;
      border-radius: 10px;
    }
    .layouts input:checked + span {
      background: #e11d48;
      border-color: #e11d48;
      font-weight: 650;
    }
    .stickers {
      display: flex;
      gap: 8px;
    }
    .stickers button {
      flex: 1;
      text-align: center;
      font-size: 22px;
      padding: 8px 0;
    }
    select {
      background: #222226;
      color: #f4f4f5;
      border: 1px solid #34343a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    [hidden] { display: none !important; }
    .music {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px solid #34343a;
      border-radius: 10px;
      background: #1b1b1f;
    }
    .music-name {
      color: #c9c9d1;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .music-range {
      display: flex;
      gap: 8px;
    }
    .music-range label {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #8b8b93;
      font-size: 12px;
    }
    .music-range input {
      width: 100%;
      padding: 8px;
      color: #f4f4f5;
      font-size: 14px;
      background: #222226;
      border: 1px solid #34343a;
      border-radius: 8px;
    }
    .music-range input.invalid {
      border-color: #ef4444;
      outline: 1px solid #ef4444;
    }
    .music-actions {
      display: flex;
      gap: 8px;
    }
    .music-actions button {
      flex: 1;
      padding: 9px 6px;
      text-align: center;
    }
    #hint {
      margin: 8px 0 0;
      color: #8b8b93;
      font-size: 13px;
      line-height: 1.45;
    }
    #stage-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 40%, #1a1a20 0%, #0c0c0e 70%);
    }
    #phone {
      padding: 10px;
      border-radius: 28px;
      background: #2a2a30;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    #busy {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.72);
      z-index: 30;
      text-align: center;
      font-size: 18px;
    }
    #busy.show { display: flex; }
  </style>
</head>
<body>
  <aside>
    <h1>Story Editor</h1>
    <div class="caption">Bố cục ảnh</div>
    <div class="layouts" role="radiogroup" aria-label="Bố cục ảnh">
      <label><input type="radio" name="layout" value="free" checked /><span>Tự do</span></label>
      <label><input type="radio" name="layout" value="split" /><span>Chia đôi</span></label>
    </div>
    <label class="btn">Upload ảnh<input id="img-input" type="file" accept="image/*" /></label>
    <label class="btn">Upload video<input id="video-input" type="file" accept="video/*" /></label>
    <button id="add-text" type="button">Thêm chữ</button>
    <div class="colors" id="colors" aria-label="Màu chữ">
      <button class="swatch active" type="button" data-color="#ffffff" style="background:#ffffff"></button>
      <button class="swatch" type="button" data-color="#000000" style="background:#000000"></button>
      <button class="swatch" type="button" data-color="#facc15" style="background:#facc15"></button>
      <button class="swatch" type="button" data-color="#fb7185" style="background:#fb7185"></button>
      <button class="swatch" type="button" data-color="#38bdf8" style="background:#38bdf8"></button>
    </div>
    <select id="font" aria-label="Phông chữ"></select>
    <div class="stickers" id="stickers" aria-label="Sticker">
      <button type="button" data-emoji="❤️" aria-label="Sticker tim">❤️</button>
      <button type="button" data-emoji="😊" aria-label="Sticker cười">😊</button>
      <button type="button" data-emoji="😢" aria-label="Sticker buồn">😢</button>
    </div>
    <label class="btn">Upload nhạc<input id="music-input" type="file" accept="audio/*" /></label>
    <div id="music-panel" class="music" hidden>
      <div id="music-name" class="music-name"></div>
      <div class="music-range">
        <label>Bắt đầu (s)<input id="music-start" type="number" min="0" step="0.1" /></label>
        <label>Kết thúc (s)<input id="music-end" type="number" min="0" step="0.1" /></label>
      </div>
      <div class="music-actions">
        <button id="music-preview" type="button">Nghe thử</button>
        <button id="music-clear" type="button">Xóa nhạc</button>
      </div>
    </div>
    <button id="delete" type="button" disabled>Xóa layer</button>
    <button id="export" class="primary" type="button">Export PNG</button>
    <p id="hint">Kéo để di chuyển. Kéo góc để resize. Kéo tay cầm phía trên để xoay. Double-click chữ để sửa. Delete để xóa layer đang chọn. Có video thì Export MP4 ghép chữ, sticker và ảnh vào clip, rồi tải story.mp4.</p>
  </aside>
  <div id="stage-wrap">
    <div id="phone"><div id="container"></div></div>
  </div>
  <div id="busy"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
